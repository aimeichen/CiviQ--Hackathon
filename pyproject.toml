[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "civiq-community-companion"
version = "0.1.0"
description = "Privacy-first multi-agent community companion built with Flower Agent"
license = { file = "LICENSE" }
requires-python = ">=3.11,<4.0"
dependencies = ["flwr>=1.39.0,<2.0", "openai>=2.16.0,<3.0.0"]

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.flwr.app]
publisher = "norahhxx"
display-name = "CiviQ — Nori Community Companion"
fab-format-version = 1
flwr-version-target = "1.39.0"
fab-include = ["agent/**/*.py", "agent/resources/**/*.json", "LICENSE"]

[tool.flwr.app.components]
agentapp = "agent.agent_app:app"
